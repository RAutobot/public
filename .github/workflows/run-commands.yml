name: Run Commands
on:
  workflow_dispatch:
    inputs:
      commands:
        description: Commands
        required: true

jobs:
  run-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          ${{ inputs.commands }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: output.txt
