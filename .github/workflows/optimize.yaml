name: Optimize
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
      cookies:
        description: Cookies

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: printf "%s\n" "FILENAME=$(curl -fsSLOJ -w %{filename_effective} -b "${{ inputs.cookies }}" "${{ inputs.url }}")" >> "$GITHUB_ENV"

      - name: Optimize
        run: zip -qd "$FILENAME" "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*"

      - run: 7z a -m0=lzma2 -mx=9 "$FILENAME.7z" "$FILENAME"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ env.FILENAME }}.7z
