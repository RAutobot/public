name: Checksum
run-name: Checksum (${{ inputs.apk && 'APK' || 'No APK' }})
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
      cookies:
        description: Cookies
      apk:
        description: APK
        type: boolean

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Download and run
        run: |
          filename="$(curl -sSLOJ -w %{filename_effective} -b "${{ inputs.cookies }}" "${{ inputs.url }}")"

          if [[ "${{ inputs.apk }}" == "true" ]]; then
            zip -q -d "$filename" "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*" "META-INF/*"
          fi

          cksum -a sha256 "$filename"
          7z a -m0=lzma2 -mx=9 file.7z .

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: file.7z
