name: Download Repository
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository
        required: true
      ref:
        description: Ref

jobs:
  download-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: repository
          path: .
